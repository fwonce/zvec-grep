name: Validate CUDA CLI package
description: Install the just-built npm tarball and prove GGUF/ONNX CUDA execution.
inputs:
  target:
    description: Native npm target built by this job.
    required: true
  package_directory:
    description: Workspace-relative directory containing the platform tarball.
    default: rust/dist/npm/release/tarballs
runs:
  using: composite
  steps:
    - name: Install the actual native npm tarball
      shell: python
      env:
        TARGET: ${{ inputs.target }}
        PACKAGE_DIRECTORY: ${{ inputs.package_directory }}
      working-directory: ${{ github.workspace }}
      run: |
        import json, os, pathlib, subprocess
        pattern = "zvec-zvec-grep-" + os.environ["TARGET"] + "-*.tgz"
        packages = list(pathlib.Path(os.environ["PACKAGE_DIRECTORY"]).glob(pattern))
        assert len(packages) == 1, "Expected exactly one platform tarball"
        subprocess.run(["npm.cmd" if os.name == "nt" else "npm", "install", "--prefix",
                        "gpu-install", "--no-audit", "--no-fund", "--ignore-scripts",
                        str(packages[0].resolve())], check=True)
        package = pathlib.Path("gpu-install/node_modules/@zvec") / ("zvec-grep-" + os.environ["TARGET"])
        metadata = json.loads((package / "package.json").read_text())
        assert metadata["zvecGrep"]["variant"] == "cuda", "Expected CUDA npm package"
        print(metadata["name"], metadata["version"], metadata["zvecGrep"])
    - name: Cache the two public test models
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/zvec-grep-model-cache
        key: cuda-cli-models-v1-${{ runner.os }}-${{ hashFiles('rust/crates/zg-engine/src/models/catalog/**', 'rust/scripts/test-cuda-cli.py') }}
    - name: Install Windows CUDA runtime libraries (not the compiler)
      if: runner.os == 'Windows'
      uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
      with:
        cuda: "12.8.1"
        method: network
        sub-packages: '["cudart", "cublas", "curand", "cufft", "nvrtc"]'
        # Required when installing two CUDA versions in the same job.
        use-local-cache: true
    - name: Install pinned Windows cuDNN
      if: runner.os == 'Windows'
      shell: powershell
      working-directory: ${{ github.workspace }}
      run: |
        python -m pip install --no-deps --require-hashes -r rust/scripts/cuda-windows-runtime.txt
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $site = python -c "import sysconfig; print(sysconfig.get_path('purelib'))"
        Get-ChildItem "$site/nvidia" -Filter *.dll -Recurse |
          ForEach-Object { $_.DirectoryName } | Sort-Object -Unique |
          Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Run Windows GGUF fallback and ONNX with only CUDA 12 visible
      if: runner.os == 'Windows'
      shell: powershell
      working-directory: ${{ github.workspace }}
      run: |
        # Compilation installed both toolkits. Hide CUDA 13 for this test.
        $cuda13 = $env:CUDA_PATH_V13_1
        if ($cuda13) {
          $env:PATH = (($env:PATH -split ';') | Where-Object {
            -not $_.Trim('"').StartsWith($cuda13.TrimEnd('\'), [StringComparison]::OrdinalIgnoreCase)
          }) -join ';'
        }
        python -c "import os,pathlib; assert not any((pathlib.Path(p)/'cublas64_13.dll').is_file() for p in os.environ['PATH'].split(os.pathsep) if p), 'CUDA 13 must be hidden for the fallback test'"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python rust/scripts/test-cuda-cli.py --bundle gpu-install/node_modules/@zvec/zvec-grep-win32-x64-msvc/bin --model-cache "$env:RUNNER_TEMP/zvec-grep-model-cache" --logs gpu-logs/cuda12 --expected-gguf-cuda 12.4
    - name: Install Windows CUDA 13.1 runtime alongside CUDA 12
      if: runner.os == 'Windows'
      uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
      with:
        cuda: "13.1.1"
        method: network
        sub-packages: '["cudart", "cublas"]'
        use-local-cache: true
    - name: Run Windows GGUF primary with ONNX still on CUDA 12
      if: runner.os == 'Windows'
      shell: powershell
      working-directory: ${{ github.workspace }}
      run: |
        python rust/scripts/test-cuda-cli.py --bundle gpu-install/node_modules/@zvec/zvec-grep-win32-x64-msvc/bin --model-cache "$env:RUNNER_TEMP/zvec-grep-model-cache" --logs gpu-logs/cuda13 --expected-gguf-cuda 13.1
    - name: Run Linux GGUF fallback and ONNX on CUDA 12 only
      if: runner.os == 'Linux'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        mkdir -p gpu-logs "${RUNNER_TEMP}/zvec-grep-model-cache"
        docker run --rm --gpus all --platform linux/amd64 \
          --volume "${GITHUB_WORKSPACE}:/work:ro" \
          --volume "${GITHUB_WORKSPACE}/gpu-logs:/logs" \
          --volume "${RUNNER_TEMP}/zvec-grep-model-cache:/model-cache" \
          --env DEBIAN_FRONTEND=noninteractive \
          nvidia/cuda:12.8.1-cudnn-runtime-ubuntu24.04@sha256:ac55d124da4882b497f732d8dfd9a702d5447a5f29d08d56da6f64f0a1eb34bc \
          bash -euo pipefail -c '
            apt-get update -qq
            apt-get install --yes --no-install-recommends python3 ca-certificates >/dev/null
            python3 /work/rust/scripts/test-cuda-cli.py \
              --bundle /work/gpu-install/node_modules/@zvec/zvec-grep-linux-x64-gnu/bin \
              --model-cache /model-cache --logs /logs/cuda12 --expected-gguf-cuda 12.4
          '
    - name: Run Linux GGUF primary on CUDA 13.1
      if: runner.os == 'Linux'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        docker run --rm --gpus all --platform linux/amd64 \
          --volume "${GITHUB_WORKSPACE}:/work:ro" \
          --volume "${GITHUB_WORKSPACE}/gpu-logs:/logs" \
          --volume "${RUNNER_TEMP}/zvec-grep-model-cache:/model-cache" \
          --env DEBIAN_FRONTEND=noninteractive \
          nvidia/cuda:13.1.1-runtime-ubuntu24.04@sha256:12e26235ebe186000d71f8e457a9ad2aed6c0cb743a7935f0443bacef206aa34 \
          bash -euo pipefail -c '
            apt-get update -qq
            apt-get install --yes --no-install-recommends python3 ca-certificates >/dev/null
            python3 /work/rust/scripts/test-cuda-cli.py \
              --bundle /work/gpu-install/node_modules/@zvec/zvec-grep-linux-x64-gnu/bin \
              --model-cache /model-cache --logs /logs/cuda13 --backend gguf --expected-gguf-cuda 13.1
          '
    - name: Make Linux cache and logs readable
      shell: bash
      if: ${{ always() && runner.os == 'Linux' }}
      working-directory: ${{ github.workspace }}
      run: |
        mkdir -p gpu-logs "${RUNNER_TEMP}/zvec-grep-model-cache"
        sudo chown -R "$(id -u):$(id -g)" gpu-logs "${RUNNER_TEMP}/zvec-grep-model-cache"
    - name: Retain CUDA evidence and failure logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: cuda-cli-evidence-${{ inputs.target }}
        path: gpu-logs/
        if-no-files-found: warn
        retention-days: 7
