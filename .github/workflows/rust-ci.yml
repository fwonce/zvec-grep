name: Rust CUDA GPU CI
run-name: Rust CUDA GPU CI / ${{ inputs.ref }}

# GPU resources are deliberately opt-in. Do not add push/pull_request triggers.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Reviewed branch, SHA, or PR merge ref (for example refs/pull/235/merge)
        required: true
        default: main
        type: string
      confirm_reviewed:
        description: I reviewed and trust this ref to execute on the hosted GPU runners
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: rust-cuda-gpu
  cancel-in-progress: false

jobs:
  source:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_reviewed }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test CUDA evidence assertions without a GPU
        run: |
          python3 rust/scripts/test-cuda-cli-checks.py
          python3 rust/scripts/test-prepare-onnxruntime-cuda.py
          python3 rust/scripts/test-build-ggml-cuda12.py

  cuda:
    name: Build and verify CUDA / ${{ matrix.target }}
    needs: source
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            runner: gpu-linux-t4
          - target: win32-x64-msvc
            runner: gpu-windows-t4
    uses: ./.github/workflows/rust-package-build.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      runner_group: gpu-runners
      source_ref: ${{ needs.source.outputs.sha }}
      cuda_architectures: "75"
      cuda_e2e: true
