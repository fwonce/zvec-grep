name: Rust CUDA GPU CI
run-name: Rust CUDA GPU CI / ${{ inputs.ref }}

# GPU resources are deliberately opt-in. Do not add push/pull_request triggers.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Reviewed branch, SHA, or PR merge ref (for example refs/pull/235/merge)
        required: true
        default: main
        type: string
      confirm_reviewed:
        description: I reviewed and trust this ref to execute on the hosted GPU runners
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: rust-cuda-gpu
  cancel-in-progress: false

jobs:
  source:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_reviewed }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test CUDA evidence assertions without a GPU
        run: python3 rust/scripts/test-cuda-cli-checks.py

  # Compile/package on ordinary runners; paid GPUs only run the installed CLI.
  package:
    needs: source
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            runner: ubuntu-latest
          - target: win32-x64-msvc
            runner: windows-2022
    uses: ./.github/workflows/rust-package-build.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      source_ref: ${{ needs.source.outputs.sha }}
      cuda_architectures: "75"

  cuda-runtime:
    name: CUDA CLI / ${{ matrix.target }}
    needs: [source, package]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            runner: gpu-linux-t4
          - target: win32-x64-msvc
            runner: gpu-windows-t4
    runs-on:
      group: gpu-runners
      labels: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Verify the Linux GPU and driver
        if: runner.os == 'Linux'
        shell: bash
        run: |
          nvidia-smi
          nvidia-smi --query-gpu=name,compute_cap,driver_version --format=csv,noheader
      - name: Verify the Windows GPU and driver
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          nvidia-smi
          nvidia-smi --query-gpu=name,compute_cap,driver_version --format=csv,noheader
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: rust-native-${{ matrix.target }}
          path: gpu-package
      - name: Install the actual native npm tarball
        shell: python
        env:
          TARGET: ${{ matrix.target }}
        run: |
          import json, os, pathlib, subprocess
          packages = list(pathlib.Path("gpu-package").glob("*.tgz"))
          assert len(packages) == 1, "Expected exactly one platform tarball"
          subprocess.run(["npm.cmd" if os.name == "nt" else "npm", "install", "--prefix",
                          "gpu-install", "--no-audit", "--no-fund", "--ignore-scripts",
                          str(packages[0].resolve())], check=True)
          package = pathlib.Path("gpu-install/node_modules/@zvec") / ("zvec-grep-" + os.environ["TARGET"])
          metadata = json.loads((package / "package.json").read_text())
          assert metadata["zvecGrep"]["variant"] == "cuda", "Expected CUDA npm package"
          print(metadata["name"], metadata["version"], metadata["zvecGrep"])
      - name: Cache the two public test models
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/zvec-grep-model-cache
          key: cuda-cli-models-v1-${{ runner.os }}-${{ hashFiles('rust/crates/zg-engine/src/models/catalog/**', 'rust/scripts/test-cuda-cli.py') }}
      - name: Install Windows CUDA runtime libraries (not the compiler)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: "13.2.0"
          method: network
          sub-packages: '["cudart", "cublas", "nvrtc"]'
          use-local-cache: false
      - name: Install pinned Windows cuDNN
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python -m pip install --no-deps --require-hashes -r rust/scripts/cuda-windows-runtime.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $site = python -c "import sysconfig; print(sysconfig.get_path('purelib'))"
          Get-ChildItem "$site/nvidia" -Filter *.dll -Recurse |
            ForEach-Object { $_.DirectoryName } | Sort-Object -Unique |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run packaged Windows CLI on CUDA
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python rust/scripts/test-cuda-cli.py --bundle gpu-install/node_modules/@zvec/zvec-grep-win32-x64-msvc/bin --model-cache "$env:RUNNER_TEMP/zvec-grep-model-cache" --logs gpu-logs
      - name: Run packaged Linux CLI on CUDA
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p gpu-logs "${RUNNER_TEMP}/zvec-grep-model-cache"
          docker run --rm --gpus all --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}:/work:ro" \
            --volume "${GITHUB_WORKSPACE}/gpu-logs:/logs" \
            --volume "${RUNNER_TEMP}/zvec-grep-model-cache:/model-cache" \
            --env DEBIAN_FRONTEND=noninteractive \
            nvidia/cuda:13.2.0-cudnn-runtime-ubuntu24.04@sha256:7a31e9bfb2086e4b1ac08aa8e4718d7860730ecc6a9882d2f1e5ed6239f8ef5b \
            bash -euo pipefail -c '
              apt-get update -qq
              apt-get install --yes --no-install-recommends python3 ca-certificates >/dev/null
              python3 /work/rust/scripts/test-cuda-cli.py \
                --bundle /work/gpu-install/node_modules/@zvec/zvec-grep-linux-x64-gnu/bin \
                --model-cache /model-cache --logs /logs
            '
      - name: Make Linux cache and logs readable
        if: ${{ always() && runner.os == 'Linux' }}
        run: sudo chown -R "$(id -u):$(id -g)" gpu-logs "${RUNNER_TEMP}/zvec-grep-model-cache"
      - name: Retain CUDA evidence and failure logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cuda-cli-evidence-${{ matrix.target }}
          path: gpu-logs/
          if-no-files-found: warn
          retention-days: 7

  windows-image-check:
    runs-on:
      group: gpu-runners
      labels: gpu-windows-t4
    timeout-minutes: 10
    steps:
      - shell: powershell
        run: |
          nvidia-smi
          nvidia-smi --query-gpu=name,compute_cap,driver_version --format=csv,noheader
