name: GPU hosted runner preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        runner: [gpu-linux-t4, gpu-windows-t4]
    runs-on:
      group: gpu-runners
      labels: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Inspect GPU and driver
        shell: bash
        run: |
          nvidia-smi
          nvidia-smi --query-gpu=name,compute_cap,driver_version --format=csv,noheader
          python --version || python3 --version
