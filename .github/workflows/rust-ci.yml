name: Rust CUDA npm artifact replay
run-name: Windows CUDA isolated diagnostics / ${{ inputs.artifact_run_id }}

# Temporary validation-branch entry point. Do not merge over ordinary Rust CI.
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Reviewed run that produced the Windows npm package to retest
        required: true
        default: "38539990022"
        type: string
      confirm_reviewed:
        description: I trust the selected package and validation code on this GPU runner
        required: true
        default: false
        type: boolean
      allow_driver_install:
        description: Allow the fixed driver installer only on this disposable hosted Windows GPU VM
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: rust-cuda-gpu-validation-windows
  cancel-in-progress: false

jobs:
  replay:
    if: ${{ inputs.confirm_reviewed }}
    runs-on:
      group: gpu-runners
      labels: gpu-windows-t4
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test hosted driver preparation safety gates (mocked, no installation)
        shell: powershell
        run: rust/scripts/test-hosted-windows-gpu-driver.ps1
      - name: Prepare pinned Node without copying into the global tool cache
        timeout-minutes: 5
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "node-24.21.0-win32-x64.7z"
          $url = "https://github.com/actions/node-versions/releases/download/24.21.0-34304089047/node-24.21.0-win32-x64.7z"
          & curl.exe -fL --retry 2 --connect-timeout 15 --max-time 120 -o $archive $url
          if ($LASTEXITCODE -ne 0) { throw "Downloading the fixed Node runtime failed" }
          $expected = "469538b0d9f1cb576d3a59f78d50eafe2deddc1b0fd3ba394aa951ab97e4fd5a"
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw "Node runtime checksum mismatch"
          }
          $runtime = Join-Path $env:RUNNER_TEMP "zg-node-24.21.0"
          & 7z x $archive "-o$runtime" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Extracting Node failed" }
          $nodes = @(Get-ChildItem -LiteralPath $runtime -Filter node.exe -Recurse |
            Where-Object { Test-Path (Join-Path $_.DirectoryName "npm.cmd") })
          if ($nodes.Count -ne 1) { throw "Expected exactly one complete Node/npm runtime" }
          $nodeDir = $nodes[0].DirectoryName
          $env:PATH = "$nodeDir;$env:PATH"
          $actual = (& ($nodes[0].FullName) --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne "v24.21.0") { throw "Unexpected Node version: $actual" }
          $nodeDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Node $actual, archive SHA256 verified; using extracted runtime directly"
          & (Join-Path $nodeDir "npm.cmd") --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@v6
        timeout-minutes: 5
        with:
          python-version: "3.12"
      - name: Prepare standalone Microsoft native debugger (no compilation)
        timeout-minutes: 8
        shell: powershell
        run: rust/scripts/prepare-windows-cdb.ps1
      - name: Verify live native stack capture before GPU tests
        timeout-minutes: 2
        shell: powershell
        run: python rust/scripts/test-windows-cdb.py
      - name: Prepare the fixed driver only when explicitly allowed and needed
        if: ${{ inputs.allow_driver_install }}
        timeout-minutes: 20
        shell: powershell
        run: |
          & rust/scripts/prepare-hosted-windows-gpu-driver.ps1 -AllowInstallation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the active GPU driver without changing it
        shell: powershell
        run: |
          & rust/scripts/prepare-windows-gpu-driver.ps1 -Logs gpu-logs/driver/verified
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test GPU evidence and workspace isolation assertions
        shell: powershell
        run: |
          python rust/scripts/test-cuda-cli-checks.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/scripts/test-windows-cuda-diagnostics.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download the already built npm package (no compilation)
        uses: actions/download-artifact@v8
        with:
          name: rust-native-win32-x64-msvc
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: rust/dist/npm/release/tarballs
      - name: Record the exact package being retested
        shell: powershell
        run: Get-ChildItem rust/dist/npm/release/tarballs/*.tgz | Get-FileHash -Algorithm SHA256 | Format-List
      - name: Install and verify both GGUF backends and ONNX on CUDA
        uses: ./.github/actions/cuda-cli-e2e
        with:
          target: win32-x64-msvc
          windows_diagnostics: "true"
      - name: Retain driver evidence even when preflight fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-driver-preflight
          path: gpu-logs/driver/
          if-no-files-found: warn
          retention-days: 7
      - name: Retain diagnostic preflight evidence even if setup fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-diagnostic-preflight
          path: gpu-logs/diagnostic-preflight/
          if-no-files-found: warn
          retention-days: 7
