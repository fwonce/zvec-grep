name: Rust CUDA CI
run-name: Rust CUDA CI / ${{ inputs.ref }}

# CUDA runners remain opt-in; publishing has its own package/GPU validation.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Reviewed branch, SHA, or PR merge ref (for example refs/pull/235/merge)
        required: true
        default: main
        type: string
      confirm_reviewed:
        description: I reviewed and trust this ref to execute on the hosted GPU runners
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: rust-cuda-ci
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  CARGO_BUILD_JOBS: 2
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  CMAKE_CUDA_ARCHITECTURES: "75"
  RUST_BACKTRACE: 1

jobs:
  source:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_reviewed }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    name: rust cuda test (${{ matrix.target }})
    needs: source
    runs-on:
      group: gpu-runners
      labels: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            runner: gpu-linux-t4
          - target: win32-x64-msvc
            runner: gpu-windows-t4
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Configure the shared model cache
        shell: python
        run: |
          import os
          cache = os.path.join(os.environ["RUNNER_TEMP"], "zvec-grep-model-cache")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"ZVEC_GREP_MODEL_CACHE={cache}\n")
      - name: Prepare Windows build tools and inspect the GPU
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          & rust/scripts/cuda/prepare-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nvidia-smi --query-gpu=name,compute_cap,driver_version --format=csv,noheader
          if ($LASTEXITCODE -ne 0) { throw "The GPU runner has no working NVIDIA driver" }
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: "2022"
      - name: Install Windows ONNX CUDA 12 runtime libraries
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["cudart", "cublas", "curand", "cufft", "nvrtc"]'
          use-local-cache: true
      - name: Install pinned Windows cuDNN
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python -m pip install --no-deps --require-hashes -r scripts/cuda/windows-runtime-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $site = python -c "import sysconfig; print(sysconfig.get_path('purelib'))"
          Get-ChildItem "$site/nvidia" -Filter *.dll -Recurse |
            ForEach-Object { $_.DirectoryName } | Sort-Object -Unique |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install the Windows CUDA compiler
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: "13.1.1"
          method: network
          sub-packages: '["nvcc", "nvvm", "crt", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'
          use-local-cache: true
      - name: Read the pinned Rust toolchain
        if: runner.os == 'Windows'
        id: rust-version
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Install the Windows Rust toolchain
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ steps.rust-version.outputs.channel }}
          components: rustfmt, clippy
      - name: Cache CUDA CI dependencies and build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            rust/target/
          key: rust-cuda-ci-v1-${{ matrix.target }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml', 'rust/scripts/cuda/cuda-builder.Dockerfile') }}-${{ needs.source.outputs.sha }}
          restore-keys: |
            rust-cuda-ci-v1-${{ matrix.target }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml', 'rust/scripts/cuda/cuda-builder.Dockerfile') }}-
      - name: Restore both real models
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/zvec-grep-model-cache
          key: rust-cuda-real-models-v1-${{ matrix.target }}-${{ hashFiles('rust/crates/zg-engine/src/models/catalog/**', 'rust/Cargo.lock') }}
          restore-keys: |
            rust-cuda-real-models-v1-${{ matrix.target }}-
      - name: Check, compile and test the Linux CUDA workspace
        if: runner.os == 'Linux'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          nvidia-smi --query-gpu=name,compute_cap,driver_version --format=csv,noheader
          mkdir -p rust/target "$HOME/.cargo/registry" "$HOME/.cargo/git"
          docker build --platform linux/amd64 --file rust/scripts/cuda/cuda-builder.Dockerfile \
            --build-arg RUST_VERSION="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust/rust-toolchain.toml)" \
            --tag zvec-grep-cuda-ci .
          docker run --rm --gpus all --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}:/work" \
            --volume "$HOME/.cargo/registry:/root/.cargo/registry" \
            --volume "$HOME/.cargo/git:/root/.cargo/git" \
            --env CARGO_INCREMENTAL --env CARGO_PROFILE_DEV_DEBUG --env CARGO_PROFILE_TEST_DEBUG \
            --env CARGO_BUILD_JOBS --env CMAKE_BUILD_PARALLEL_LEVEL --env CMAKE_CUDA_ARCHITECTURES \
            --env RUST_BACKTRACE --env CARGO_TERM_COLOR \
            --env ORT_DYLIB_PATH=/work/rust/target/debug/libonnxruntime.so.1 \
            zvec-grep-cuda-ci bash -euo pipefail -c '
              cargo fmt --all --check
              cargo check --locked --workspace --all-targets --features zg/cuda
              cargo clippy --locked --workspace --all-targets --features zg/cuda -- -D warnings
              cargo test --locked --workspace --all-targets --features zg/cuda --no-run \
                --message-format=json > target/cuda-ci-tests.json
              python3 scripts/cuda/prepare-onnxruntime.py --platform linux \
                --cache-dir target/ort-cuda12 --destination target/debug
              cargo test --locked --workspace --all-targets --features zg/cuda
              cargo run --locked -p zg --features cuda -- --rg "zvec-grep Rust rewrite" README.md
            '
      - name: Check Windows formatting
        if: runner.os == 'Windows'
        shell: powershell
        run: cargo fmt --all --check
      - name: Check the Windows CUDA workspace
        if: runner.os == 'Windows'
        shell: powershell
        run: cargo check --locked --workspace --all-targets --features zg/cuda
      - name: Run Windows CUDA Clippy
        if: runner.os == 'Windows'
        shell: powershell
        run: cargo clippy --locked --workspace --all-targets --features zg/cuda -- -D warnings
      - name: Compile Windows CUDA workspace tests
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force target | Out-Null
          # cmd preserves Cargo's UTF-8 JSON instead of PowerShell 5's UTF-16 redirection.
          cmd.exe /d /c "cargo test --locked --workspace --all-targets --features zg/cuda --no-run --message-format=json > target\cuda-ci-tests.json"
      - name: Run Windows CUDA workspace tests
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python scripts/cuda/prepare-onnxruntime.py --platform win32 --cache-dir target/ort-cuda12 --destination target/debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ORT_DYLIB_PATH = (Resolve-Path target/debug/onnxruntime.dll).Path
          # Cargo test executables need the compiled native DLLs, not an npm bundle.
          $nativeDirectories = Get-ChildItem -Path target/debug -Filter *.dll -Recurse |
            ForEach-Object { $_.DirectoryName } | Sort-Object -Unique
          $env:PATH = ($nativeDirectories -join ';') + ';' + $env:PATH
          cargo test --locked --workspace --all-targets --features zg/cuda
      - name: Smoke test the Windows CUDA CLI
        if: runner.os == 'Windows'
        shell: powershell
        run: cargo run --locked -p zg --features cuda -- --rg "zvec-grep Rust rewrite" README.md
      - name: Locate the existing workspace model test binary
        id: model-test
        shell: python
        run: |
          import json, os, pathlib
          records = [json.loads(line) for line in pathlib.Path("target/cuda-ci-tests.json").read_text(encoding="utf-8").splitlines()]
          binaries = [record["executable"] for record in records
                      if record.get("reason") == "compiler-artifact"
                      and record["target"]["name"] == "zg_engine"
                      and record["profile"]["test"] and record.get("executable")]
          assert len(binaries) == 1, f"Expected one zg-engine test executable: {binaries}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"path={binaries[0]}\n")
      - name: Run both Linux CUDA models without rebuilding
        if: runner.os == 'Linux'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CUDA_MODEL_TEST_BINARY: ${{ steps.model-test.outputs.path }}
        run: |
          mkdir -p rust/cuda-model-logs "$ZVEC_GREP_MODEL_CACHE"
          for spec in \
            'onnx|local/all-minilm-l6-v2|nvidia/cuda:12.8.1-cudnn-runtime-ubuntu24.04@sha256:ac55d124da4882b497f732d8dfd9a702d5447a5f29d08d56da6f64f0a1eb34bc' \
            'gguf|local/embeddinggemma-300m|nvidia/cuda:13.1.1-runtime-ubuntu24.04@sha256:12e26235ebe186000d71f8e457a9ad2aed6c0cb743a7935f0443bacef206aa34'; do
            IFS='|' read -r backend model runtime_image <<< "$spec"
            # The same compiled test binary runs with each backend's host dependencies.
            docker run --rm --gpus all --platform linux/amd64 \
              --volume "${GITHUB_WORKSPACE}:/work:ro" \
              --volume "$ZVEC_GREP_MODEL_CACHE:/model-cache" \
              --workdir /work/rust --env DEBIAN_FRONTEND=noninteractive \
              --env ZVEC_GREP_MODEL_CACHE=/model-cache \
              --env ZVEC_GREP_SMOKE_MODEL="$model" --env ZVEC_GREP_SMOKE_DEVICE=cuda \
              --env ORT_LOG=verbose --env RUST_BACKTRACE --env CUDA_MODEL_TEST_BINARY \
              --env ORT_DYLIB_PATH=/work/rust/target/debug/libonnxruntime.so.1 \
              "$runtime_image" bash -euo pipefail -c '
                apt-get update -qq
                apt-get install --yes --no-install-recommends ca-certificates >/dev/null
                # Match Cargo test dynamic-library lookup for the existing executable.
                native_dirs="$(find /work/rust/target/debug -name "*.so*" -printf "%h\n" | sort -u | paste -sd :)"
                export LD_LIBRARY_PATH="${native_dirs}:${LD_LIBRARY_PATH:-}"
                "$CUDA_MODEL_TEST_BINARY" models::tests::real_model_smoke::selected_local_model_downloads_loads_and_embeds \
                  --ignored --exact --nocapture
              ' 2>&1 | tee "rust/cuda-model-logs/${backend}.log"
          done
      - name: Run both Windows CUDA models without rebuilding
        if: runner.os == 'Windows'
        shell: python
        env:
          CUDA_MODEL_TEST_BINARY: ${{ steps.model-test.outputs.path }}
        run: |
          import os, pathlib, subprocess
          environment = dict(os.environ)
          environment.update(ZVEC_GREP_SMOKE_DEVICE="cuda", ORT_LOG="verbose",
                             ORT_DYLIB_PATH=str(pathlib.Path("target/debug/onnxruntime.dll").resolve()))
          native_dirs = sorted({str(path.parent.resolve()) for path in pathlib.Path("target/debug").rglob("*.dll")})
          environment["PATH"] = os.pathsep.join([*native_dirs, environment["PATH"]])
          logs = pathlib.Path("cuda-model-logs")
          logs.mkdir(exist_ok=True)
          for backend, model in (("onnx", "local/all-minilm-l6-v2"), ("gguf", "local/embeddinggemma-300m")):
              environment["ZVEC_GREP_SMOKE_MODEL"] = model
              log_path = logs / f"{backend}.log"
              with log_path.open("w", encoding="utf-8") as log:
                  result = subprocess.run([environment["CUDA_MODEL_TEST_BINARY"],
                      "models::tests::real_model_smoke::selected_local_model_downloads_loads_and_embeds",
                      "--ignored", "--exact", "--nocapture"], env=environment,
                      stdout=log, stderr=subprocess.STDOUT, timeout=900)
              print(log_path.read_text(encoding="utf-8", errors="replace"), flush=True)
              result.check_returncode()
      - name: Require actual CUDA execution for both models without CPU fallback
        shell: python
        run: |
          import pathlib, sys
          sys.path.insert(0, str(pathlib.Path("scripts/cuda").resolve()))
          from e2e import cuda_evidence
          for backend in ("onnx", "gguf"):
              log = pathlib.Path(f"cuda-model-logs/{backend}.log").read_text(encoding="utf-8", errors="replace")
              for line in cuda_evidence(log, backend, "13.1"):
                  print(line)
      - name: Restore Linux cache ownership
        if: ${{ always() && runner.os == 'Linux' }}
        shell: bash
        run: |
          mkdir -p target "$HOME/.cargo/registry" "$HOME/.cargo/git" "$ZVEC_GREP_MODEL_CACHE"
          sudo chown -R "$(id -u):$(id -g)" target "$HOME/.cargo/registry" "$HOME/.cargo/git" "$ZVEC_GREP_MODEL_CACHE"
      - name: Retain real CUDA model logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cuda-model-evidence-${{ matrix.target }}
          path: rust/cuda-model-logs/
          if-no-files-found: warn
          retention-days: 7
