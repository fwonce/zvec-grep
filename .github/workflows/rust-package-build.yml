name: Build a native Rust package

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      runner:
        type: string
        required: true
      runner_group:
        description: Optional runner group for the GPU hosts.
        type: string
        default: ""
      cuda_e2e:
        description: Build and run CUDA CLI validation together on a GPU host.
        type: boolean
        default: false
      cuda_architectures:
        type: string
        required: false
        default: ""
      source_ref:
        description: Optional immutable source revision for manual GPU validation
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  native:
    name: Build ${{ inputs.target }}
    runs-on: ${{ inputs.runner_group != '' && fromJSON(format('{{"group":"{0}","labels":"{1}"}}', inputs.runner_group, inputs.runner)) || inputs.runner }}
    timeout-minutes: ${{ (inputs.target == 'darwin-x64' || inputs.target == 'win32-x64-msvc') && 180 || 90 }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        if: inputs.cuda_e2e || runner.os == 'Windows'
        with:
          python-version: "3.12"
      - name: Prepare the Windows GPU build tools
        if: inputs.cuda_e2e && runner.os == 'Windows'
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          & rust/scripts/prepare-windows-build-tools.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the Linux GPU before building
        if: inputs.cuda_e2e && runner.os == 'Linux'
        run: nvidia-smi --query-gpu=name,compute_cap,driver_version --format=csv,noheader
      - name: Prepare the Windows GPU before building
        if: inputs.cuda_e2e && runner.os == 'Windows'
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          & rust/scripts/prepare-windows-gpu-driver.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nvidia-smi --query-gpu=name,compute_cap,driver_version --format=csv,noheader
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: "2022"
      - name: Install the pinned Windows CUDA toolkit
        if: inputs.target == 'win32-x64-msvc'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: "13.1.1"
          method: network
          sub-packages: '["nvcc", "nvvm", "crt", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'
          # Keep each installer in a version-specific directory: the action's
          # uncached download directory cannot contain two CUDA versions.
          use-local-cache: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build pkg-config
      - name: Read the pinned Rust toolchain
        id: rust-version
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Install the pinned Rust toolchain, including rustup if missing
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ steps.rust-version.outputs.channel }}
          components: rustfmt, clippy
      - name: Restore Cargo build state
        id: cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/registry/src/
            ~/.cargo/git/db/
            rust/target/release/
            rust/target/ggml-cuda12/
            rust/target/.zvec-grep-cuda-build-config
          key: rust-release-v2-${{ inputs.target }}-${{ inputs.runner }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-release-v2-${{ inputs.target }}-${{ inputs.runner }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - name: Restore the CUDA 12 ONNX Runtime archives
        if: inputs.target == 'win32-x64-msvc' || inputs.target == 'linux-x64-gnu'
        uses: actions/cache@v5
        with:
          path: rust/target/ort-cuda12/
          key: rust-ort-cuda12-v1-${{ inputs.target }}-${{ hashFiles('rust/scripts/prepare-onnxruntime-cuda.py') }}
      - name: Restore the Intel macOS ONNX Runtime
        if: inputs.target == 'darwin-x64'
        id: ort-cache
        uses: actions/cache/restore@v5
        with:
          path: rust/target/ort-runtime/
          key: rust-ort-v2-1.28.0-${{ inputs.runner }}-${{ hashFiles('rust/scripts/build-onnxruntime-macos.sh') }}
      - name: Build ONNX Runtime for Intel macOS
        if: inputs.target == 'darwin-x64' && steps.ort-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-onnxruntime-macos.sh
      - name: Save the compiled Intel macOS ONNX Runtime
        if: inputs.target == 'darwin-x64' && steps.ort-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: rust/target/ort-runtime/
          key: ${{ steps.ort-cache.outputs.cache-primary-key }}
      - name: Restore the Intel macOS zvec SDK
        if: inputs.target == 'darwin-x64'
        id: zvec-cache
        uses: actions/cache/restore@v5
        with:
          path: rust/target/zvec-runtime/
          key: rust-zvec-v1-0.7.2-${{ inputs.runner }}-${{ hashFiles('rust/scripts/build-zvec-macos.sh') }}
      - name: Build the zvec SDK for Intel macOS
        if: inputs.target == 'darwin-x64' && steps.zvec-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-zvec-macos.sh
      - name: Save the compiled Intel macOS zvec SDK
        if: inputs.target == 'darwin-x64' && steps.zvec-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: rust/target/zvec-runtime/
          key: ${{ steps.zvec-cache.outputs.cache-primary-key }}
      - name: Use the Intel macOS runtime libraries
        if: inputs.target == 'darwin-x64'
        run: |
          echo "ORT_LIB_PATH=$GITHUB_WORKSPACE/rust/target/ort-runtime" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
          echo "ZVEC_LIB_DIR=$GITHUB_WORKSPACE/rust/target/zvec-runtime" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
      - name: Build the pinned CUDA toolchain image
        if: inputs.target == 'linux-x64-gnu'
        working-directory: ${{ github.workspace }}
        run: >-
          docker build --platform linux/amd64
          --file rust/docker/cuda-builder.Dockerfile
          --tag zvec-grep-cuda-builder .
      - name: Build the Linux CPU/CUDA bundle
        if: inputs.target == 'linux-x64-gnu'
        working-directory: ${{ github.workspace }}
        env:
          CMAKE_CUDA_ARCHITECTURES: ${{ inputs.cuda_architectures }}
        run: |
          docker run --rm --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}:/work:ro" \
            --volume "${GITHUB_WORKSPACE}/rust/target:/work-target" \
            --env CARGO_TARGET_DIR=/work-target \
            --env CMAKE_BUILD_PARALLEL_LEVEL=2 \
            --env CMAKE_CUDA_ARCHITECTURES \
            zvec-grep-cuda-builder \
            bash scripts/build-cuda.sh --primary-only
      - name: Build the Linux CUDA 12.4 fallback plugin
        if: inputs.target == 'linux-x64-gnu'
        working-directory: ${{ github.workspace }}
        env:
          CMAKE_CUDA_ARCHITECTURES: ${{ inputs.cuda_architectures }}
        run: |
          docker build --platform linux/amd64 --file rust/docker/cuda-builder.Dockerfile \
            --build-arg CUDA_IMAGE=nvidia/cuda:12.4.1-devel-ubuntu22.04@sha256:da6791294b0b04d7e65d87b7451d6f2390b4d36225ab0701ee7dfec5769829f5 \
            --tag zvec-grep-cuda12-builder .
          docker run --rm --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}:/work:ro" \
            --volume "${GITHUB_WORKSPACE}/rust/target:/work-target" \
            --env CARGO_TARGET_DIR=/work-target \
            --env CMAKE_BUILD_PARALLEL_LEVEL=2 --env CMAKE_CUDA_ARCHITECTURES \
            zvec-grep-cuda12-builder bash -euo pipefail -c '
              python3 scripts/build-ggml-cuda12.py --bundle /work-target/release/zg-cuda
              bash scripts/check-cuda-linkage.sh /work-target/release/zg-cuda
            '
      - name: Restore ownership of Linux build output
        if: ${{ always() && inputs.target == 'linux-x64-gnu' }}
        run: sudo chown -R "$(id -u):$(id -g)" target
      - name: Run the Linux bundle without any CUDA runtime installed
        if: inputs.target == 'linux-x64-gnu'
        working-directory: ${{ github.workspace }}
        run: |
          docker run --rm --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --volume "${GITHUB_WORKSPACE}/rust/target/release/zg-cuda:/opt/zg:ro" \
            ubuntu:24.04 bash -euo pipefail -c '
              apt-get update >/dev/null
              apt-get install --yes --no-install-recommends libstdc++6 >/dev/null
              ldd /opt/zg/libggml-cuda.so | grep -Eq "lib(cuda|cudart|cublas).*not found"
              /opt/zg/zg --help >/dev/null
              /opt/zg/zg --rg -F "zvec-grep Rust rewrite" /workspace/rust/README.md >/dev/null
            '
      - name: Build the Windows CPU/CUDA bundle
        if: inputs.target == 'win32-x64-msvc'
        env:
          CMAKE_CUDA_ARCHITECTURES: ${{ inputs.cuda_architectures }}
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass
          -File scripts/build-cuda-windows.ps1 -PrimaryOnly
      - name: Install the Windows CUDA 12.4 fallback toolkit
        if: inputs.target == 'win32-x64-msvc'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: "12.4.1"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust"]'
          use-local-cache: true
      - name: Install the CUDA 12.4 compatible MSVC toolset
        if: inputs.target == 'win32-x64-msvc'
        shell: powershell
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property installationPath
          if (-not (Test-Path "$vs/VC/Tools/MSVC/14.38.*")) {
            $installer = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/setup.exe"
            $result = Start-Process $installer -ArgumentList @('modify', '--installPath', "`"$vs`"", '--add', 'Microsoft.VisualStudio.Component.VC.14.38.17.8.x86.x64', '--quiet', '--norestart') -Wait -PassThru
            if ($result.ExitCode -notin @(0, 3010)) { throw "MSVC 14.38 installation failed: $($result.ExitCode)" }
          }
      - name: Use the CUDA 12.4 compatible MSVC toolset
        if: inputs.target == 'win32-x64-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: "2022"
          toolset: "14.38"
      - name: Build the Windows CUDA 12.4 fallback plugin
        if: inputs.target == 'win32-x64-msvc'
        env:
          CMAKE_CUDA_ARCHITECTURES: ${{ inputs.cuda_architectures }}
        run: python scripts/build-ggml-cuda12.py --bundle target/release/zg-cuda --cuda-root "$env:CUDA_PATH"
      - name: Build the native target
        if: inputs.target != 'linux-x64-gnu' && inputs.target != 'win32-x64-msvc'
        run: npm run build
      - name: Save Cargo build state
        if: ${{ always() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/registry/src/
            ~/.cargo/git/db/
            rust/target/release/
            rust/target/ggml-cuda12/
            rust/target/.zvec-grep-cuda-build-config
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Audit the Windows CPU/CUDA bundle
        if: inputs.target == 'win32-x64-msvc'
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass
          -File scripts/check-cuda-linkage-windows.ps1
          -Bundle target/release/zg-cuda
      - name: Apply local macOS signatures after building
        if: runner.os == 'macOS'
        run: |
          for binary in target/release/*.dylib target/release/zg; do
            if [[ -f "$binary" ]]; then
              codesign --force --sign - "$binary"
              codesign --verify "$binary"
            fi
          done
      - name: Package the native target
        run: npm run release:platform -- --no-build --target ${{ inputs.target }}
      - name: Install the tarballs and run the packaged CLI
        run: npm run release:smoke -- --no-build --target ${{ inputs.target }}
      - name: Upload the platform package
        uses: actions/upload-artifact@v7
        with:
          name: rust-native-${{ inputs.target }}
          path: rust/dist/npm/release/tarballs/zvec-zvec-grep-${{ inputs.target }}-*.tgz
          if-no-files-found: error
          retention-days: 14
      - name: Verify GGUF and ONNX CUDA through the installed npm package
        if: inputs.cuda_e2e
        uses: ./.github/actions/cuda-cli-e2e
        with:
          target: ${{ inputs.target }}
