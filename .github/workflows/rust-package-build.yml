name: Build a native Rust package

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      runner:
        type: string
        required: true
      cuda_architectures:
        type: string
        required: false
        default: ""
      source_ref:
        description: Optional immutable source revision for manual GPU validation
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  native:
    name: Build ${{ inputs.target }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ (inputs.target == 'darwin-x64' || inputs.target == 'win32-x64-msvc') && 180 || 90 }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install the pinned Windows CUDA toolkit
        if: inputs.target == 'win32-x64-msvc'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: "13.2.0"
          method: network
          sub-packages: '["nvcc", "nvvm", "crt", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'
          use-local-cache: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build pkg-config
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
      - name: Restore Cargo build state
        id: cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/registry/src/
            ~/.cargo/git/db/
            rust/target/release/
            rust/target/.zvec-grep-cuda-build-config
          key: rust-release-v2-${{ inputs.target }}-${{ inputs.runner }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-release-v2-${{ inputs.target }}-${{ inputs.runner }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - name: Restore the Windows ONNX Runtime
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: rust/target/ort-prebuilt/
          key: rust-ort-windows-cuda13-v2-${{ hashFiles('rust/Cargo.lock', 'rust/scripts/prepare-onnxruntime-windows.py') }}
      - name: Prepare the verified Windows ONNX Runtime
        if: runner.os == 'Windows'
        run: |
          python scripts/test-prepare-onnxruntime-windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare-onnxruntime-windows.py --cuda
      - name: Restore the Intel macOS ONNX Runtime
        if: inputs.target == 'darwin-x64'
        id: ort-cache
        uses: actions/cache/restore@v5
        with:
          path: rust/target/ort-runtime/
          key: rust-ort-v2-1.28.0-${{ inputs.runner }}-${{ hashFiles('rust/scripts/build-onnxruntime-macos.sh') }}
      - name: Build ONNX Runtime for Intel macOS
        if: inputs.target == 'darwin-x64' && steps.ort-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-onnxruntime-macos.sh
      - name: Save the compiled Intel macOS ONNX Runtime
        if: inputs.target == 'darwin-x64' && steps.ort-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: rust/target/ort-runtime/
          key: ${{ steps.ort-cache.outputs.cache-primary-key }}
      - name: Restore the Intel macOS zvec SDK
        if: inputs.target == 'darwin-x64'
        id: zvec-cache
        uses: actions/cache/restore@v5
        with:
          path: rust/target/zvec-runtime/
          key: rust-zvec-v1-0.7.2-${{ inputs.runner }}-${{ hashFiles('rust/scripts/build-zvec-macos.sh') }}
      - name: Build the zvec SDK for Intel macOS
        if: inputs.target == 'darwin-x64' && steps.zvec-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-zvec-macos.sh
      - name: Save the compiled Intel macOS zvec SDK
        if: inputs.target == 'darwin-x64' && steps.zvec-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: rust/target/zvec-runtime/
          key: ${{ steps.zvec-cache.outputs.cache-primary-key }}
      - name: Use the Intel macOS runtime libraries
        if: inputs.target == 'darwin-x64'
        run: |
          echo "ORT_LIB_PATH=$GITHUB_WORKSPACE/rust/target/ort-runtime" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
          echo "ZVEC_LIB_DIR=$GITHUB_WORKSPACE/rust/target/zvec-runtime" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
      - name: Build the pinned CUDA toolchain image
        if: inputs.target == 'linux-x64-gnu'
        working-directory: ${{ github.workspace }}
        run: >-
          docker build --platform linux/amd64
          --file rust/docker/cuda-builder.Dockerfile
          --tag zvec-grep-cuda-builder .
      - name: Build the Linux CPU/CUDA bundle
        if: inputs.target == 'linux-x64-gnu'
        working-directory: ${{ github.workspace }}
        env:
          CMAKE_CUDA_ARCHITECTURES: ${{ inputs.cuda_architectures }}
        run: |
          docker run --rm --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}:/work:ro" \
            --volume "${GITHUB_WORKSPACE}/rust/target:/work-target" \
            --env CARGO_TARGET_DIR=/work-target \
            --env CMAKE_BUILD_PARALLEL_LEVEL=2 \
            --env CMAKE_CUDA_ARCHITECTURES \
            --env ORT_CUDA_VERSION=13 \
            zvec-grep-cuda-builder \
            bash scripts/build-cuda.sh
      - name: Build the Windows CPU/CUDA bundle
        if: inputs.target == 'win32-x64-msvc'
        env:
          CMAKE_CUDA_ARCHITECTURES: ${{ inputs.cuda_architectures }}
          ORT_CUDA_VERSION: "13"
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass
          -File scripts/build-cuda-windows.ps1 -SkipAudit
      - name: Build the native target
        if: inputs.target != 'linux-x64-gnu' && inputs.target != 'win32-x64-msvc'
        run: npm run build
      - name: Save Cargo build state
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/registry/src/
            ~/.cargo/git/db/
            rust/target/release/
            rust/target/.zvec-grep-cuda-build-config
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Audit the Windows CPU/CUDA bundle
        if: inputs.target == 'win32-x64-msvc'
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass
          -File scripts/check-cuda-linkage-windows.ps1
          -Bundle target/release/zg-cuda
      - name: Apply local macOS signatures after building
        if: runner.os == 'macOS'
        run: |
          for binary in target/release/*.dylib target/release/zg; do
            if [[ -f "$binary" ]]; then
              codesign --force --sign - "$binary"
              codesign --verify "$binary"
            fi
          done
      - name: Package the native target
        run: npm run release:platform -- --no-build --target ${{ inputs.target }}
      - name: Install the tarballs and run the packaged CLI
        run: npm run release:smoke -- --no-build --target ${{ inputs.target }}
      - name: Upload the platform package
        uses: actions/upload-artifact@v7
        with:
          name: rust-native-${{ inputs.target }}
          path: rust/dist/npm/release/tarballs/zvec-zvec-grep-${{ inputs.target }}-*.tgz
          if-no-files-found: error
          retention-days: 14
